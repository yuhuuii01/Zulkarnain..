<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Generate a random joke with one click.">
  <title>Random Joke Generator</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --card:#1b2940; --text:#f8fafc; --muted:#b6c2d2; --accent:#7c3aed; --accent-hover:#8b5cf6; }
    * { box-sizing:border-box; margin:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at top,#263b61,var(--bg) 60%); }
    .app { width:min(680px,100%); text-align:center; }
    .badge { display:inline-block; margin-bottom:16px; padding:6px 12px; border:1px solid #64748b; border-radius:999px; color:var(--muted); font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin-bottom:10px; font-size:clamp(2rem,6vw,3.5rem); }
    .intro { margin-bottom:28px; color:var(--muted); }
    .joke-card { min-height:250px; display:flex; flex-direction:column; justify-content:center; gap:20px; padding:clamp(24px,6vw,48px); border:1px solid #334155; border-radius:20px; background:rgba(27,41,64,.9); box-shadow:0 20px 60px rgba(0,0,0,.28); }
    .joke-type { color:#c4b5fd; font-size:.8rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .setup { font-size:clamp(1.2rem,3vw,1.65rem); font-weight:600; line-height:1.45; }
    .punchline { color:#fcd34d; font-size:clamp(1.1rem,2.6vw,1.4rem); line-height:1.5; }
    .placeholder { color:var(--muted); }
    button { border:0; border-radius:10px; padding:13px 22px; color:white; background:var(--accent); font:inherit; font-weight:700; cursor:pointer; transition:background .2s,transform .2s; }
    button:hover { background:var(--accent-hover); transform:translateY(-2px); }
    button:focus-visible { outline:3px solid #c4b5fd; outline-offset:3px; }
    button:disabled { cursor:wait; opacity:.65; transform:none; }
    .status { min-height:24px; margin-top:16px; color:var(--muted); font-size:.9rem; }
    .error { color:#fca5a5; }
    .credit { margin-top:22px; color:#64748b; font-size:.78rem; }
  </style>
</head>
<body>
  <main class="app">
    <span class="badge">Powered by an external API</span>
    <h1>Random Joke Generator</h1>
    <p class="intro">Need a quick laugh? Fetch a fresh joke below.</p>

    <section class="joke-card" aria-live="polite" aria-atomic="true">
      <p class="joke-type" id="jokeType">Ready when you are</p>
      <p class="placeholder" id="setup">Click the button to load a random joke.</p>
      <p class="punchline" id="punchline"></p>
      <div><button id="jokeButton" type="button">Tell me a joke</button></div>
    </section>
    <p class="status" id="status" role="status"></p>
    <p class="credit">Jokes provided by the Official Joke API.</p>
  </main>

  <script>
    const API_URL = 'https://official-joke-api.appspot.com/random_joke';
    const button = document.getElementById('jokeButton');
    const jokeType = document.getElementById('jokeType');
    const setup = document.getElementById('setup');
    const punchline = document.getElementById('punchline');
    const status = document.getElementById('status');

    async function getJoke() {
      button.disabled = true;
      button.textContent = 'Loading…';
      status.textContent = '';
      status.className = 'status';

      try {
        const response = await fetch(API_URL, { headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error(`Request failed: ${response.status}`);
        const joke = await response.json();
        if (!joke.setup || !joke.punchline) throw new Error('The API returned an invalid joke.');

        jokeType.textContent = joke.type || 'Random joke';
        setup.textContent = joke.setup;
        setup.className = 'setup';
        punchline.textContent = joke.punchline;
      } catch (error) {
        status.textContent = 'Could not load a joke. Please try again.';
        status.className = 'status error';
      } finally {
        button.disabled = false;
        button.textContent = 'Tell me another joke';
      }
    }

    button.addEventListener('click', getJoke);
  </script>
</body>
</html>
